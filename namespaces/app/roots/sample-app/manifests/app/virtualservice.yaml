apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: sample-app
spec:
  gateways:
    - "istio-gateway/sample-app"
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: sample-app
            port:
              number: 80
