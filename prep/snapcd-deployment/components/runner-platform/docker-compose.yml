# Signed in to Azure interactively after start (see `make up`).
services:
  snapcd-runner-platform:
    image: ghcr.io/schrieksoft/snapcd/snapcd-runner-azure:1.15.6
    restart: unless-stopped
    entrypoint: ["/app/entrypoint.sh", "--urls", "http://0.0.0.0:5001"]
    environment:
      Runner__Id: ${PLATFORM_RUNNER_ID:-}
      Runner__Instance: platform
      Runner__Credentials__ClientId: ${PLATFORM_RUNNER_CLIENT_ID:-}
      Runner__Credentials__ClientSecret: ${PLATFORM_RUNNER_CLIENT_SECRET:-}
      RunnerEnvVars__SNAPCD_CLIENT_ID: ${PLATFORM_RUNNER_CLIENT_ID:-}
      RunnerEnvVars__SNAPCD_CLIENT_SECRET: ${PLATFORM_RUNNER_CLIENT_SECRET:-}
    volumes:
      - ./config/appsettings.json:/app/appsettings.json:ro
      # Optional: layer environment-specific overrides on top of the committed defaults.
      # Create components/runner-platform/config/appsettings.Production.json (gitignored), then
      # uncomment. Leave it commented if you have no overrides.
      # - ./config/appsettings.Production.json:/app/appsettings.Production.json:ro

      # Must be unique per runner and per compose project.
      - ${PLATFORM_RUNNER_DATA_DIR:-~/.snapcd/platform-runner-data}:/app/runnerdata

      # Pre-approved hooks directory (optional)
      - ./config/preapproved-hooks:/app/preapproved-hooks:ro

      # Stages the SSH key into ~/.ssh at 0600 before the Runner starts.
      - ./config/entrypoint.sh:/app/entrypoint.sh:ro

      # SSH keys for private Git repositories (optional). Staged rather than mounted
      # onto ~/.ssh, because a bind mount keeps the host's permissions.
      - ./config/known_hosts:/run/secrets/ssh/known_hosts:ro
      - ./config/id_rsa:/run/secrets/ssh/id_rsa:ro

      # Terraform/OpenTofu binaries from host (pick one or both, edit path as needed)
      - /usr/local/bin/terraform:/usr/local/bin/terraform:ro
      - /usr/local/bin/tofu:/usr/local/bin/tofu:ro
    networks:
      - snapcd-net

  # Forwards two ports on the Runner's own localhost: 5000 to the Server, and
  # 9000 to the host machine, so URLs like http://localhost:5000 work identically
  # on the host and inside the Runner (e.g. a state store served from the host).
  runner-loopback-platform:
    image: alpine/socat
    restart: unless-stopped
    network_mode: "service:snapcd-runner-platform"
    depends_on:
      - snapcd-runner-platform
    entrypoint: ["sh", "-c",
      "socat TCP6-LISTEN:5000,fork,reuseaddr,ipv6only=0 TCP:snapcd-server:5000 & exec socat TCP6-LISTEN:9000,fork,reuseaddr,ipv6only=0 TCP:$(ip route | awk '/default/{print $3; exit}'):9000"]

networks:
  snapcd-net:
